<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Starcat</title>
    <link rel="icon" type="image/png" href="../assets/icons/icon-32.png">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup" hidden>
      <header class="app-header">
        <img class="app-icon" src="../assets/icons/icon-48.png" width="36" height="36" alt="">
        <div>
          <h1>Starcat</h1>
          <p data-i18n="browser"></p>
        </div>
        <span id="version" class="version"></span>
      </header>

      <section id="connection-card" class="connection-card" aria-labelledby="connection-title">
        <div class="connection-summary" role="status" aria-atomic="true">
          <span class="status-dot" aria-hidden="true"></span>
          <div>
            <h2 id="connection-title"></h2>
            <p id="connection-description"></p>
          </div>
        </div>

        <dl class="last-check">
          <dt data-i18n="lastChecked"></dt>
          <dd id="last-checked"></dd>
        </dl>

        <a id="pair" class="primary-action" href="../pairing/pairing.html" target="_blank" rel="noopener" data-i18n="pair" hidden></a>
        <button id="test" class="primary-action" type="button"></button>
      </section>

      <button id="open-options" class="options-link" type="button">
        <span data-i18n="settings"></span>
        <span aria-hidden="true">↗</span>
      </button>
    </main>

    <script src="../shared/shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
